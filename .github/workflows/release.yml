name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a release for, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$VERSION" = "$TAG" ] || { echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/package_linux.sh dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          NAME="ArthursUniversePlayground-$VERSION-windows-x64"
          mkdir -p "dist/$NAME"
          cp target/release/arthurs-universe-playground.exe "dist/$NAME/Arthur's Universe Playground.exe"
          cp README.md CHANGELOG.md "dist/$NAME/"
          cd dist && 7z a "$NAME.zip" "$NAME"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk
          scripts/bundle_macos.sh
          NAME="ArthursUniversePlayground-$VERSION-macos-arm64"
          mkdir -p dist/dmg
          cp -R "target/release/bundle/Arthur's Universe Playground.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Arthur's Universe Playground" -srcfolder dist/dmg -ov -format UDZO "dist/$NAME.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::No CHANGELOG.md entry for $VERSION"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
