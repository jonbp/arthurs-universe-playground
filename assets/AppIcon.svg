<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#2b1640"/>
      <stop offset="1" stop-color="#05040e"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.25" stop-color="#ffd36b"/>
      <stop offset="0.6" stop-color="#ff8a2a"/>
      <stop offset="1" stop-color="#b8321a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0.35" stop-color="#ff9a3a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fd0ff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="top" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="1024" height="530"/></clipPath>
    <clipPath id="bot" clipPathUnits="userSpaceOnUse"><rect x="0" y="530" width="1024" height="500"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <g fill="#fff" opacity="0.8">
      <circle cx="210" cy="240" r="3"/><circle cx="830" cy="230" r="3.5"/><circle cx="170" cy="760" r="2.5"/>
      <circle cx="860" cy="780" r="3"/><circle cx="560" cy="170" r="2"/><circle cx="300" cy="880" r="2"/>
    </g>
    <circle cx="512" cy="530" r="380" fill="url(#glow)"/>
    <!-- lensed image of the far side of the disk -->
    <circle cx="512" cy="530" r="185" fill="none" stroke="url(#disk)" stroke-width="44" opacity="0.9"/>
    <!-- disk, far half -->
    <g transform="rotate(-10 512 530)" clip-path="url(#top)">
      <ellipse cx="512" cy="530" rx="360" ry="78" fill="none" stroke="url(#disk)" stroke-width="40"/>
    </g>
    <!-- shadow + photon ring -->
    <circle cx="512" cy="530" r="150" fill="#000"/>
    <circle cx="512" cy="530" r="154" fill="none" stroke="#fff3cc" stroke-width="5"/>
    <!-- disk, near half -->
    <g transform="rotate(-10 512 530)" clip-path="url(#bot)">
      <ellipse cx="512" cy="530" rx="360" ry="78" fill="none" stroke="url(#disk)" stroke-width="40"/>
    </g>
    <!-- a world being spaghettified -->
    <path d="M760 250 Q690 300 640 360" stroke="url(#spag)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <ellipse cx="775" cy="238" rx="30" ry="22" transform="rotate(-38 775 238)" fill="#3a8ee8"/>
    <ellipse cx="768" cy="232" rx="12" ry="9" transform="rotate(-38 768 232)" fill="#58d07a"/>
  </g>
</svg>
